<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Mahasiswa - S1 Akuntansi AKT2026-F</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">
    <header class="bg-indigo-900 text-white shadow-lg sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="p-2 bg-indigo-700 rounded-lg"><i class="fa-solid fa-graduation-cap text-xl text-amber-400"></i></div>
                <div>
                    <h1 class="font-bold text-lg">Portal Mahasiswa - S1 Akuntansi AKT2026-F</h1>
                    <p class="text-xs text-indigo-300">Terintegrasi otomatis dengan Admin Kelas.</p>
                </div>
            </div>
            <button onclick="configureCloud()" class="bg-indigo-700 hover:bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-xs font-semibold">
                <i class="fa-solid fa-sync mr-1"></i> Hubungkan ID Cloud
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">
        <div class="mb-6">
            <h2 class="text-xl font-bold text-slate-800">Direktori Mahasiswa AKT2026-F</h2>
            <p class="text-xs text-slate-500">Daftar lengkap anggota kelas perkuliahan.</p>
        </div>

        <div id="studentsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            <!-- Data Mahasiswa dari Cloud -->
        </div>
    </main>

    <script>
        let BIN_ID = localStorage.getItem('jsonbin_id_mhs_2026') || '';
        let API_KEY = localStorage.getItem('jsonbin_key_mhs_2026') || '';

        async function loadPublicData() {
            if (!BIN_ID) {
                document.getElementById('studentsGrid').innerHTML = `
                    <div class="col-span-full text-center py-12 bg-white rounded-xl border">
                        <p class="text-sm text-slate-600 mb-2">Belum terhubung ke database kelas.</p>
                        <button onclick="configureCloud()" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-xs font-semibold">Masukkan Bin ID & API Key Admin</button>
                    </div>`;
                return;
            }
            try {
                let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                let json = await res.json();
                let students = json.record.students || [];
                
                let grid = document.getElementById('studentsGrid');
                grid.innerHTML = students.map(s => `
                    <div class="bg-white p-4 rounded-xl border shadow-sm flex items-center space-x-3">
                        <img src="${s.photo}" class="w-12 h-12 rounded-full object-cover">
                        <div class="flex-1 min-w-0">
                            <span class="text-[10px] font-bold px-2 py-0.5 bg-indigo-50 text-indigo-600 rounded">${s.role}</span>
                            <h4 class="font-bold text-sm truncate mt-0.5">${s.name}</h4>
                            <p class="text-xs font-mono text-slate-500">${s.nim}</p>
                        </div>
                    </div>
                `).join('');
            } catch(e) { console.error(e); }
        }

        function configureCloud() {
            let b = prompt("Masukkan JSONbin Bin ID yang sama dengan Admin:", BIN_ID);
            let k = prompt("Masukkan JSONbin Master API Key:", API_KEY);
            if (b && k) {
                localStorage.setItem('jsonbin_id_mhs_2026', b);
                localStorage.setItem('jsonbin_key_mhs_2026', k);
                BIN_ID = b; API_KEY = k;
                loadPublicData();
            }
        }

        loadPublicData();
        setInterval(loadPublicData, 5000);
    </script>
</body>
</html>
